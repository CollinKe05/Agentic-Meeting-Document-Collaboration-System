[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-langgraph-agent"
version = "0.1.0"
description = "Offline edge-device-friendly LangGraph agent with local markdown skills and Ollama backend."
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "requests>=2.31.0",
    "typing-extensions>=4.10.0",
]

[project.scripts]
edge-agent = "agent_edge.__main__:main"

[tool.setuptools.packages.find]
include = ["agent_edge*"]
