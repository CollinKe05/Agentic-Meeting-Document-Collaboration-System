[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-langgraph-agent"
version = "0.1.0"
description = "离线边缘端 LangGraph Agent，使用本地 Markdown 技能、llama.cpp 后端和 MinerU 文档解析。"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "requests>=2.31.0",
    "typing-extensions>=4.10.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "onnxruntime>=1.15.0",
    "PyMuPDF>=1.23.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "pyclipper>=1.3.0",
    "shapely>=2.0.0",
    "python-multipart>=0.0.6",
    "sherpa-onnx>=1.13.0",
    "sounddevice>=0.5.0",
    "soundfile>=0.13.0",
]

[project.scripts]
edge-agent = "agent_edge.__main__:main"
edge-agent-ui = "agent_edge.web_app:main"

[tool.setuptools.packages.find]
include = ["agent_edge*", "sys_core*"]

[tool.setuptools.package-data]
agent_edge = ["ui/*"]
"sys_core.syss" = ["models/**/*", "ocr/ppocr/**/*.txt", "ocr/ppocr/**/*.md"]
