[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-langgraph-agent"
version = "0.1.0"
description = "离线边缘端 LangGraph Agent，使用本地 Markdown 技能、llama.cpp 后端和 MinerU 文档解析。"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "requests>=2.31.0",
    "typing-extensions>=4.10.0",
]

[project.scripts]
edge-agent = "agent_edge.__main__:main"
edge-agent-ui = "agent_edge.web_app:main"

[tool.setuptools.packages.find]
include = ["agent_edge*"]

[tool.setuptools.package-data]
agent_edge = ["ui/*"]
