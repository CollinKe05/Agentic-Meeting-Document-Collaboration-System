<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent 控制中心 - 离线版</title>
    
    <script src="tailwind.min.js"></script>
    
    <style>
        body {
            /* 使用系统默认的现代高质量字体族，完美适配 Windows、Mac、iOS、Android，无需加载外部网络字体 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            background-color: #f3f4f6; /* bg-gray-100 */
        }
        /* 自定义滚动条样式 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; /* slate-300 */
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; /* slate-400 */
        }
        
        /* 拖拽区域的高亮动画 */
        .drag-active {
            border-color: #3b82f6; /* blue-500 */
            background-color: #eff6ff; /* blue-50 */
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-gray-800">

    <header class="bg-white shadow-sm h-14 flex items-center justify-between px-6 flex-shrink-0 z-10 relative">
        <div class="flex items-center gap-2">
            <!-- 机器人 SVG 图标 (代替 ph-robot) -->
            <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h.01M15 9h.01M8 14h8" />
            </svg>
            <h1 class="text-xl font-semibold text-gray-800">Agent 控制中心</h1>
        </div>
        <div class="flex items-center gap-4 text-sm text-gray-500">
            <span class="flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-green-500"></span> 
                Agent 在线 (本地运行)
            </span>
            <label class="hidden lg:flex items-center gap-2">
                <span>模型</span>
                <select id="model-select" class="h-8 w-48 rounded-lg border border-gray-200 bg-white px-2 text-xs text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-100">
                    <option value="">读取中</option>
                </select>
            </label>
            <span class="hidden md:flex items-center gap-1.5">
                <span id="resource-status-dot" class="w-2 h-2 rounded-full bg-slate-300"></span>
                <span id="resource-status-text">资源状态：读取中</span>
            </span>
        </div>
    </header>

    <main class="flex-1 overflow-hidden grid grid-cols-12 gap-4 p-4 h-full relative">

        <aside class="col-span-3 flex flex-col gap-4 h-full overflow-hidden">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 flex-1 flex flex-col overflow-hidden">
                <div class="px-4 py-3 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                    <h2 class="font-medium flex items-center gap-2 text-sm text-gray-700">
                        <!-- 代码 SVG 图标 (代替 ph-code) -->
                        <svg class="w-4 h-4 text-indigo-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
                        </svg>
                        自建 Skill.md
                    </h2>
                    <button id="save-skill-button" class="text-gray-400 hover:text-gray-600 focus:outline-none" onclick="showLocalToast('已保存技能配置到本地')">
                        <!-- 磁盘保存 SVG 图标 (代替 ph-floppy-disk) -->
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
                        </svg>
                    </button>
                </div>
                <div class="p-0 flex-1 relative">
                    <textarea class="w-full h-full resize-none p-4 text-xs font-mono bg-gray-50 text-gray-700 outline-none focus:ring-2 focus:ring-inset focus:ring-indigo-200" placeholder="在此定义Agent技能...
例如:
- name: read_file
  description: 读取本地文件内容
  parameters: ...">
# 默认技能配置
- name: analyze_data
  description: 对输入的数据进行分析并生成图表
  enabled: true
- name: web_search
  description: 在本地知识库或内网进行检索
  enabled: true
</textarea>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-200 h-1/3 flex flex-col overflow-hidden">
                <div class="px-4 py-3 border-b border-gray-100 bg-gray-50/50">
                    <h2 class="font-medium flex items-center gap-2 text-sm text-gray-700">
                        <!-- 列表/任务 SVG 图标 (代替 ph-list-dashes) -->
                        <svg class="w-4 h-4 text-teal-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                        任务记录
                    </h2>
                </div>
                <div class="p-2 overflow-y-auto flex-1 space-y-2 text-sm" id="task-list">
                    <!-- 模拟完成任务 -->
                    <div class="p-2 rounded bg-gray-50 border border-gray-100 flex items-start gap-2">
                        <!-- 成功勾选 SVG -->
                        <svg class="w-4 h-4 text-green-500 mt-0.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <div>
                            <p class="font-medium text-xs text-gray-700">解析本地数据报表.csv</p>
                            <p class="text-[10px] text-gray-500">10:42 AM · 耗时 4.2s</p>
                        </div>
                    </div>
                    <!-- 模拟进行中任务 -->
                    <div class="p-2 rounded bg-gray-50 border border-gray-100 flex items-start gap-2">
                        <!-- 加载等待 SVG -->
                        <svg class="animate-spin h-4 w-4 text-blue-500 mt-0.5 shrink-0" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                        </svg>
                        <div>
                            <p class="font-medium text-xs text-gray-700">总结局域网会议记录.docx</p>
                            <p class="text-[10px] text-gray-500">处理中...</p>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <section class="col-span-6 flex flex-col bg-white rounded-xl shadow-sm border border-gray-200 h-full overflow-hidden relative">
            
            <!-- 3. 显示 Agent 思考过程 (顶部悬浮) -->
            <div id="agent-thought-process" class="hidden border-b border-indigo-100 bg-indigo-50/50 p-4 transition-all duration-300 relative">
                <button onclick="toggleThoughtProcess()" class="absolute top-2 right-2 text-gray-400 hover:text-gray-600">
                    <!-- 关闭 SVG 图标 -->
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
                <h3 class="text-xs font-semibold text-indigo-600 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                    <!-- 脑力 SVG 动画 -->
                    <svg class="w-4 h-4 animate-pulse text-indigo-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                    </svg>
                    Agent 思考与执行步骤
                </h3>
                <div class="space-y-3 text-xs" id="thought-steps">
                    <!-- 动态插入执行步骤 -->
                </div>
            </div>

            <!-- 1. 基础的聊天框 (居中主要区域) -->
            <div class="flex-1 overflow-y-auto p-6 space-y-6 bg-gray-50/30" id="chat-messages">
                <!-- 欢迎消息 -->
                <div class="flex items-start gap-3">
                    <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center flex-shrink-0 text-blue-600">
                        <!-- 机器人 SVG -->
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h.01M15 9h.01M8 14h8" />
                        </svg>
                    </div>
                    <div class="bg-white border border-gray-100 p-4 rounded-2xl rounded-tl-none shadow-sm max-w-[85%]">
                        <p class="text-sm">你好！我是您的离线智能 Agent。您可以直接在下方输入指令，或拖拽文件给我。界面完全由本地静态资源解析，100% 离线安全运行。</p>
                    </div>
                </div>
            </div>

            <!-- 输入区域 & 2. 拖拽/点击上传文件 -->
            <div class="p-4 border-t border-gray-100 bg-white">
                <div id="drop-zone" class="border-2 border-dashed border-gray-200 rounded-xl p-2 transition-colors relative group">
                    
                    <!-- 文件预览区域 -->
                    <div id="file-preview-area" class="hidden flex gap-2 mb-2 p-2 bg-gray-50 rounded-lg overflow-x-auto">
                        <!-- 文件标签模板 -->
                    </div>

                    <div class="flex items-end gap-2">
                        <!-- 隐藏的实际文件输入框 -->
                        <input type="file" id="file-input" class="hidden" multiple>
                        
                        <!-- 离线上传文件按钮 -->
                        <button onclick="document.getElementById('file-input').click()" class="p-2.5 text-gray-400 hover:text-blue-500 hover:bg-blue-50 rounded-lg transition-colors focus:outline-none" title="上传本地文件">
                            <!-- 回形针 SVG -->
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
                            </svg>
                        </button>

                        <!-- 文本输入框 -->
                        <textarea id="prompt-input" rows="1" class="flex-1 bg-transparent border-0 outline-none resize-none py-2.5 px-2 text-sm text-gray-700 placeholder-gray-400 max-h-32" placeholder="输入你的指令，或将本地文件拖拽至此..." oninput="autoResize(this)"></textarea>
                        
                        <!-- 语音输入按钮 -->
                        <button id="voice-input-btn" class="p-2.5 text-gray-400 hover:text-rose-500 hover:bg-rose-50 rounded-lg transition-colors focus:outline-none" title="语音输入">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.5v3m0 0h3m-3 0H9M8 10a4 4 0 108 0V6a4 4 0 10-8 0v4zm10 0a6 6 0 01-12 0" />
                            </svg>
                        </button>

                        <!-- 发送按钮 -->
                        <button onclick="sendMessage()" class="p-2.5 bg-blue-600 text-white hover:bg-blue-700 rounded-lg transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed focus:outline-none" id="send-btn">
                            <!-- 发送纸飞机 SVG -->
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                            </svg>
                        </button>
                    </div>
                    
                    <!-- 拖拽提示遮罩 -->
                    <div class="absolute inset-0 bg-blue-50/90 backdrop-blur-sm rounded-xl flex items-center justify-center border-2 border-blue-400 opacity-0 pointer-events-none group-[.drag-active]:opacity-100 transition-opacity z-10">
                        <p class="text-blue-600 font-medium flex items-center gap-2 text-sm">
                            <!-- 向上上传 SVG -->
                            <svg class="w-5 h-5 animate-bounce" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                            </svg>
                            松开鼠标上传本地文件
                        </p>
                    </div>
                </div>
                <div class="text-center mt-2 text-[10px] text-gray-400">
                    支持按 Enter 发送，Shift + Enter 换行
                </div>
            </div>
        </section>

        <aside class="col-span-3 bg-white rounded-xl shadow-sm border border-gray-200 h-full overflow-hidden flex flex-col">
            <div class="px-4 py-3 border-b border-gray-100 bg-gray-50/50">
                <h2 class="font-medium flex items-center gap-2 text-sm text-gray-700">
                    <!-- 闪电 SVG 图标 (代替 ph-lightning) -->
                    <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                    可用功能
                </h2>
            </div>
            <div class="p-3 pb-28 overflow-y-auto flex-1 space-y-2">
                
                <!-- 功能 1 -->
                <button onclick="triggerFunction('file_parse')" class="w-full text-left p-2.5 rounded-lg border border-gray-100 hover:border-blue-200 hover:bg-blue-50 transition-all group focus:outline-none">
                    <div class="flex items-center gap-2.5">
                        <div class="w-7 h-7 rounded bg-blue-100 text-blue-600 flex items-center justify-center shrink-0">
                            <!-- 文本文件 SVG (代替 ph-file-text) -->
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                            </svg>
                        </div>
                        <div>
                            <h3 class="font-medium text-xs text-gray-800 group-hover:text-blue-700">本地文件解析</h3>
                            <p class="text-[10px] text-gray-500 mt-0.5">选择本地文件，自动提取内容</p>
                        </div>
                    </div>
                </button>

                <!-- 功能 2 -->
                <button onclick="insertPrompt('请帮我总结以下内容：\n\n')" class="w-full text-left p-2.5 rounded-lg border border-gray-100 hover:border-purple-200 hover:bg-purple-50 transition-all group focus:outline-none">
                    <div class="flex items-center gap-2.5">
                        <div class="w-7 h-7 rounded bg-purple-100 text-purple-600 flex items-center justify-center shrink-0">
                            <!-- 文章报告 SVG (代替 ph-article) -->
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z" />
                            </svg>
                        </div>
                        <div>
                            <h3 class="font-medium text-xs text-gray-800 group-hover:text-purple-700">内容摘要生成</h3>
                            <p class="text-[10px] text-gray-500 mt-0.5">离线快速归纳文章核心观点</p>
                        </div>
                    </div>
                </button>

                <!-- 功能 3 -->
                <button onclick="insertPrompt('请对以下数据进行分析，找出异常趋势：\n\n')" class="w-full text-left p-2.5 rounded-lg border border-gray-100 hover:border-emerald-200 hover:bg-emerald-50 transition-all group focus:outline-none">
                    <div class="flex items-center gap-2.5">
                        <div class="w-7 h-7 rounded bg-emerald-100 text-emerald-600 flex items-center justify-center shrink-0">
                            <!-- 数据折线图 SVG (代替 ph-chart-line-up) -->
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                            </svg>
                        </div>
                        <div>
                            <h3 class="font-medium text-xs text-gray-800 group-hover:text-emerald-700">数据深度透视</h3>
                            <p class="text-[10px] text-gray-500 mt-0.5">识别离线数据模式与趋势</p>
                        </div>
                    </div>
                </button>

                 <!-- 功能 4 -->
                 <button onclick="triggerFunction('code_review')" class="w-full text-left p-2.5 rounded-lg border border-gray-100 hover:border-orange-200 hover:bg-orange-50 transition-all group focus:outline-none">
                    <div class="flex items-center gap-2.5">
                        <div class="w-7 h-7 rounded bg-orange-100 text-orange-600 flex items-center justify-center shrink-0">
                            <!-- 花括号代码审查 SVG (代替 ph-brackets-curly) -->
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M8 3H7a2 2 0 00-2 2v5a2 2 0 01-1 2 2 2 0 011 2v5a2 2 0 002 2h1M16 3h1a2 2 0 022 2v5a2 2 0 011 2 2 2 0 01-1 2v5a2 2 0 02-2 2h-1" />
                            </svg>
                        </div>
                        <div>
                            <h3 class="font-medium text-xs text-gray-800 group-hover:text-orange-700">离线代码 Review</h3>
                            <p class="text-[10px] text-gray-500 mt-0.5">审查本地代码潜在缺陷和安全</p>
                        </div>
                    </div>
                </button>
            </div>
        </aside>

    </main>

    <!-- 本地模拟文件选择弹窗 -->
    <div id="file-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-xl w-96 max-w-[90vw] overflow-hidden transform transition-all">
            <div class="px-4 py-3 border-b border-gray-100 flex justify-between items-center">
                <h3 class="font-medium text-sm text-gray-800">选择需要载入的本地模拟文件</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 focus:outline-none">
                    <!-- 关闭 SVG -->
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div class="p-4 space-y-4">
                <div class="space-y-2">
                    <label class="flex items-center gap-3 p-2.5 rounded hover:bg-gray-50 cursor-pointer border border-transparent hover:border-gray-200">
                        <input type="radio" name="modal-file" value="data_report_2023.csv" class="text-blue-600 focus:ring-blue-500">
                        <!-- CSV 文件 SVG -->
                        <svg class="w-5 h-5 text-emerald-600 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                        <span class="text-xs text-gray-700">data_report_2023.csv</span>
                    </label>
                    <label class="flex items-center gap-3 p-2.5 rounded hover:bg-gray-50 cursor-pointer border border-transparent hover:border-gray-200">
                        <input type="radio" name="modal-file" value="user_feedback.txt" class="text-blue-600 focus:ring-blue-500">
                        <!-- 文本文件 SVG -->
                        <svg class="w-5 h-5 text-blue-500 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                        <span class="text-xs text-gray-700">user_feedback.txt</span>
                    </label>
                </div>
            </div>
            <div class="px-4 py-3 bg-gray-50 flex justify-end gap-2">
                <button onclick="closeModal()" class="px-4 py-2 text-xs text-gray-600 hover:bg-gray-200 rounded-lg transition-colors focus:outline-none">取消</button>
                <button onclick="confirmFileSelection()" class="px-4 py-2 text-xs bg-blue-600 text-white hover:bg-blue-700 rounded-lg transition-colors focus:outline-none">确认载入并填充</button>
            </div>
        </div>
    </div>

    <!-- 会议控制 -->
    <div id="meeting-control" class="fixed bottom-6 right-6 z-50 bg-white border border-gray-100 shadow-xl rounded-xl p-3 w-64 max-w-[calc(100vw-2rem)] transition-all">
        <div class="flex items-center justify-between gap-3">
            <div id="meeting-control-details">
                <p class="text-xs font-semibold text-gray-800">会议记录</p>
                <p id="meeting-status-text" class="text-[11px] text-green-600 mt-0.5">等待会议请求</p>
            </div>
            <div class="flex items-center gap-2">
                <span id="meeting-status-dot" class="w-2.5 h-2.5 rounded-full bg-green-500"></span>
                <button id="meeting-toggle-btn" class="px-3 py-1.5 rounded-lg bg-gray-900 text-white text-xs font-medium hover:bg-gray-700 focus:outline-none">ON</button>
                <button id="meeting-collapse-btn" class="px-2 py-1.5 rounded-lg border border-gray-200 bg-white text-gray-500 text-xs hover:bg-gray-50 focus:outline-none" title="收起会议浮窗">−</button>
            </div>
        </div>
    </div>

    <!-- 自定义轻量级 Toast 提示区域 -->
    <div id="toast-container" class="fixed bottom-28 right-6 flex flex-col gap-2 z-50"></div>


    <script>
        const inputElement = document.getElementById('prompt-input');
        const chatMessages = document.getElementById('chat-messages');
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const filePreviewArea = document.getElementById('file-preview-area');
        const thoughtProcessPanel = document.getElementById('agent-thought-process');
        const thoughtStepsContainer = document.getElementById('thought-steps');
        const taskList = document.getElementById('task-list');

        let selectedFiles = []; // 存储当前选中的文件

        // --- 1. 轻量级离线轻提示 (替代 alert) ---
        function showLocalToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-gray-900/90 text-white text-xs py-2 px-4 rounded-lg shadow-lg flex items-center gap-2 animate-fade-in-up';
            toast.innerHTML = `
                <svg class="w-4 h-4 text-green-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span>${message}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // --- 2. 输入框自适应高度 ---
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
            if (textarea.value === '') textarea.style.height = 'auto';
        }

        // --- 3. 拖放与文件加载逻辑 ---
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('drag-active'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('drag-active'), false);
        });

        dropZone.addEventListener('drop', handleDrop, false);
        fileInput.addEventListener('change', handleFilesSelect, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        }

        function handleFilesSelect(e) {
            const files = e.target.files;
            handleFiles(files);
            fileInput.value = ''; // 重置以支持重复上传
        }

        function handleFiles(files) {
            if (files.length > 0) {
                Array.from(files).forEach(file => {
                    if (!selectedFiles.some(f => f.name === file.name)) {
                        selectedFiles.push(file);
                    }
                });
                renderFilePreviews();
                inputElement.focus();
            }
        }

        function renderFilePreviews() {
            if (selectedFiles.length === 0) {
                filePreviewArea.classList.add('hidden');
                return;
            }
            
            filePreviewArea.classList.remove('hidden');
            filePreviewArea.innerHTML = '';
            
            selectedFiles.forEach((file, index) => {
                const fileTag = document.createElement('div');
                fileTag.className = 'flex items-center gap-1.5 bg-white border border-gray-200 px-2 py-1 rounded text-[11px] text-gray-700 shrink-0 shadow-sm';
                fileTag.innerHTML = `
                    <svg class="w-3.5 h-3.5 text-gray-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
                    </svg>
                    <span class="max-w-[100px] truncate" title="${file.name}">${file.name}</span>
                    <button onclick="removeFile(${index})" class="text-gray-400 hover:text-red-500 focus:outline-none ml-1">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                `;
                filePreviewArea.appendChild(fileTag);
            });
        }

        window.removeFile = function(index) {
            selectedFiles.splice(index, 1);
            renderFilePreviews();
        }

        // --- 4. 对话发送与渲染 ---
        inputElement.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function appendMessage(sender, text, files = []) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex items-start gap-3 ${sender === 'user' ? 'flex-row-reverse' : ''}`;
            
            const avatar = document.createElement('div');
            avatar.className = `w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 ${
                sender === 'user' ? 'bg-indigo-100 text-indigo-600' : 'bg-blue-100 text-blue-600'
            }`;
            
            // 离线版头像 SVG
            if (sender === 'user') {
                avatar.innerHTML = `
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                `;
            } else {
                avatar.innerHTML = `
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h.01M15 9h.01M8 14h8" />
                    </svg>
                `;
            }
            
            const bubble = document.createElement('div');
            const bubbleColors = sender === 'user' 
                ? 'bg-indigo-600 text-white rounded-tr-none' 
                : 'bg-white border border-gray-100 text-gray-800 rounded-tl-none shadow-sm';
            
            bubble.className = `p-4 rounded-2xl max-w-[85%] ${bubbleColors} whitespace-pre-wrap break-words text-sm`;
            
            // 如果含有上传的文件
            if (files.length > 0) {
                const fileContainer = document.createElement('div');
                fileContainer.className = 'flex flex-wrap gap-2 mb-2';
                files.forEach(f => {
                     fileContainer.innerHTML += `
                        <div class="flex items-center gap-1 bg-black/10 px-2 py-1 rounded text-xs">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
                            </svg>
                            ${f.name || f}
                        </div>`;
                });
                bubble.appendChild(fileContainer);
            }

            const textEl = document.createElement('span');
            textEl.textContent = text;
            bubble.appendChild(textEl);
            
            wrapper.appendChild(avatar);
            wrapper.appendChild(bubble);
            
            chatMessages.appendChild(wrapper);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        window.sendMessage = function() {
            const text = inputElement.value.trim();
            const hasFiles = selectedFiles.length > 0;

            if (!text && !hasFiles) return;

            const sendBtn = document.getElementById('send-btn');
            sendBtn.disabled = true;
            sendBtn.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
            `;

            const filesToSend = [...selectedFiles];
            appendMessage('user', text, filesToSend);
            
            inputElement.value = '';
            inputElement.style.height = 'auto';
            selectedFiles = [];
            renderFilePreviews();

            // 激活离线 Agent 执行模拟
            simulateAgentResponse(text, filesToSend);
        }

        // --- 5. 本地 Agent 模拟运行逻辑 ---
        function simulateAgentResponse(query, files) {
            thoughtProcessPanel.classList.remove('hidden');
            thoughtStepsContainer.innerHTML = '';
            
            const taskId = 'task-' + Date.now();
            const taskTitle = files.length > 0 ? `离线处理: ${files[0].name || files[0]}` : `内网执行: ${query.substring(0, 15)}...`;
            addTaskToHistory(taskId, taskTitle);

            const steps = [
                { msg: "已从本地环境捕获到执行信号", icon: `<svg class="w-4 h-4 text-indigo-400 animate-pulse" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>` },
                { msg: "通过本地语义模型分析意图，完成本地推理路线图规划...", icon: `<svg class="w-4 h-4 text-indigo-400 animate-pulse" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3" /></svg>` },
            ];

            if (files.length > 0) {
                steps.push({ msg: `安全隔离沙箱读取文件: ${files[0].name || files[0]}`, icon: `<svg class="w-4 h-4 text-indigo-400 animate-pulse" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7" /></svg>` });
                steps.push({ msg: "提取并校验本地特征码，输出局部语义解析...", icon: `<svg class="w-4 h-4 text-indigo-400 animate-pulse" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>` });
            }
            
            steps.push({ msg: "推理完毕，生成离线安全解答", icon: `<svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>` });

            let currentStep = 0;
            
            function nextStep() {
                if (currentStep < steps.length) {
                    const step = steps[currentStep];
                    addThoughtStep(step.msg, step.icon, currentStep === steps.length - 1);
                    currentStep++;
                    setTimeout(nextStep, Math.random() * 600 + 700);
                } else {
                    finishProcessing(taskId);
                }
            }
            
            setTimeout(nextStep, 400);
        }

        function addThoughtStep(text, svgIcon, isLast) {
            const stepEl = document.createElement('div');
            stepEl.className = 'flex items-start gap-2 animate-fade-in-up';
            
            stepEl.innerHTML = `
                <div class="mt-0.5 shrink-0">${svgIcon}</div>
                <span class="text-gray-600">${text}</span>
            `;
            thoughtStepsContainer.appendChild(stepEl);
            thoughtStepsContainer.parentElement.scrollTop = thoughtStepsContainer.parentElement.scrollHeight;
        }

        function toggleThoughtProcess() {
            thoughtProcessPanel.classList.add('hidden');
        }

        function finishProcessing(taskId) {
            const sendBtn = document.getElementById('send-btn');
            sendBtn.disabled = false;
            sendBtn.innerHTML = `
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                </svg>
            `;

            const replyText = "【离线安全运行环境】解析完毕！\n本地 Agent 已成功对请求及载入的文件执行本地断点推理。结果如下：\n- 本地数据库状态：一切正常\n- 数据模型准确率：100%（离线模式下，您的所有操作完全在内网安全隔离，没有任何数据上传至公网。）";
            appendMessage('agent', replyText);

            updateTaskStatus(taskId, true);

            setTimeout(() => {
                toggleThoughtProcess();
            }, 3000);
        }

        // --- 6. 任务状态管理 ---
        function addTaskToHistory(id, title) {
            const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            const taskHtml = `
                <div id="${id}" class="p-2 rounded bg-gray-50 border border-gray-100 flex items-start gap-2 transition-all">
                    <div class="status-icon shrink-0">
                        <svg class="animate-spin h-4 w-4 text-blue-500 mt-0.5" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                        </svg>
                    </div>
                    <div>
                        <p class="font-medium text-gray-700 text-[11px]">${title}</p>
                        <p class="text-[9px] text-gray-500 status-text">${time} · 正在推理...</p>
                    </div>
                </div>
            `;
            taskList.insertAdjacentHTML('afterbegin', taskHtml);
        }

        function updateTaskStatus(id, isSuccess) {
            const taskEl = document.getElementById(id);
            if (taskEl) {
                const iconContainer = taskEl.querySelector('.status-icon');
                const text = taskEl.querySelector('.status-text');
                
                iconContainer.innerHTML = `
                    <svg class="w-4 h-4 text-green-500 mt-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                `;
                
                const timeStr = text.innerText.split('·')[0];
                text.innerText = `${timeStr}· 本地完成`;
                taskEl.classList.add('bg-green-50');
                
                setTimeout(() => {
                    taskEl.classList.remove('bg-green-50');
                }, 1000);
            }
        }

        // --- 7. 功能面板 & 填充 Prompt ---
        window.insertPrompt = function(text) {
            inputElement.value = text;
            inputElement.focus();
            autoResize(inputElement);
        }

        let pendingFunctionPrompt = '';
        window.triggerFunction = function(type) {
            if (type === 'file_parse') {
                pendingFunctionPrompt = "请读取并解析以下本地文件内容，提取关键信息：\n";
                openModal();
            } else if (type === 'code_review') {
                pendingFunctionPrompt = "请帮我 Review 以下本地代码文件，找出潜在的 Bug 和性能瓶颈：\n";
                openModal();
            }
        }

        const modal = document.getElementById('file-modal');
        function openModal() {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }
        
        window.closeModal = function() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            const radios = document.getElementsByName('modal-file');
            radios.forEach(r => r.checked = false);
        }

        window.confirmFileSelection = function() {
            const selected = document.querySelector('input[name="modal-file"]:checked');
            if (selected) {
                const fileName = selected.value;
                if (!selectedFiles.some(f => f.name === fileName)) {
                    selectedFiles.push({ name: fileName, isPlaceholder: true });
                }
                renderFilePreviews();
                
                insertPrompt(pendingFunctionPrompt);
                closeModal();
                showLocalToast('已载入示例文件名，完成 Prompt 填充');
            } else {
                showLocalToast('请先选择一个需要处理的文件');
            }
        }

        // 动画追加样式
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes fadeInUp {
                from { opacity: 0; transform: translateY(5px); }
                to { opacity: 1; transform: translateY(0); }
            }
            .animate-fade-in-up {
                animation: fadeInUp 0.25s ease-out forwards;
            }
        `;
        document.head.appendChild(style);

    </script>
    <script src="agent-ui-runtime.js"></script>
</body>
</html>
